<svg xmlns="http://www.w3.org/2000/svg" width="620" height="82" viewBox="0 0 620 82" role="img" aria-labelledby="title desc">
  <title id="title">flutterffi</title>
  <desc id="desc">Animated flutterffi account name with a typing reveal effect.</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 56px;
      font-weight: 700;
      fill: #24292f;
    }

    #reveal rect {
      animation: reveal 3.2s steps(10, end) infinite;
    }

    .cursor {
      animation: cursor 3.2s steps(10, end) infinite, blink .8s steps(1, end) infinite;
      fill: #0969da;
    }

    @media (prefers-color-scheme: dark) {
      text {
        fill: #f0f6fc;
      }

      .cursor {
        fill: #58a6ff;
      }
    }

    @keyframes reveal {
      0%, 8% { width: 0; }
      52%, 92% { width: 360px; }
      100% { width: 0; }
    }

    @keyframes cursor {
      0%, 8% { transform: translateX(0); }
      52%, 92% { transform: translateX(360px); }
      100% { transform: translateX(0); }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="82"/>
    </clipPath>
  </defs>
  <text x="0" y="58" clip-path="url(#reveal)">flutterffi</text>
  <rect class="cursor" x="5" y="16" width="5" height="52" rx="2"/>
</svg>
