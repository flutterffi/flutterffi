<svg xmlns="http://www.w3.org/2000/svg" width="920" height="82" viewBox="0 0 920 82" role="img" aria-labelledby="title desc">
  <title id="title">Welcome to flutterffi</title>
  <desc id="desc">Animated Welcome to flutterffi title with a typing reveal effect.</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 700;
      fill: #0f1419;
    }

    #reveal rect {
      animation: reveal 3.6s steps(20, end) infinite;
    }

    .cursor {
      animation: cursor 3.6s steps(20, end) infinite, blink .8s steps(1, end) infinite;
      fill: #0f1419;
    }

    @media (prefers-color-scheme: dark) {
      text {
        fill: #e7e9ea;
      }

      .cursor {
        fill: #e7e9ea;
      }
    }

    @keyframes reveal {
      0%, 8% { width: 0; }
      60%, 92% { width: 610px; }
      100% { width: 0; }
    }

    @keyframes cursor {
      0%, 8% { transform: translateX(0); }
      60%, 92% { transform: translateX(610px); }
      100% { transform: translateX(0); }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="82"/>
    </clipPath>
  </defs>
  <text x="0" y="58" clip-path="url(#reveal)">Welcome to flutterffi</text>
  <rect class="cursor" x="5" y="17" width="5" height="48" rx="2"/>
</svg>
