<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f1724"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#081023"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#7b61ff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>

  <!-- left accent strip -->
  <rect x="0" y="0" width="12" height="360" fill="url(#accent)" rx="6"/>

  <!-- Title -->
  <g transform="translate(40,32)">
    <text x="0" y="0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700">flutterffi — Flutter · Native · Web</text>
    <text x="0" y="36" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#9aa6b2">Cross-platform apps • native integrations • backend tooling</text>
  </g>

  <!-- code area background -->
  <g transform="translate(40,92)">
    <rect width="1120" height="220" rx="12" fill="#071127" filter="url(#shadow)"/>

    <!-- gutter -->
    <rect x="0" y="0" width="56" height="220" fill="#06101e" rx="12"/>

    <!-- line numbers -->
    <g font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" fill="#253042" opacity="0.95" transform="translate(12,20)">
      <text x="0" y="0">1</text>
      <text x="0" y="20">2</text>
      <text x="0" y="40">3</text>
      <text x="0" y="60">4</text>
      <text x="0" y="80">5</text>
      <text x="0" y="100">6</text>
      <text x="0" y="120">7</text>
      <text x="0" y="140">8</text>
      <text x="0" y="160">9</text>
      <text x="0" y="180">10</text>
    </g>

    <!-- code text -->
    <g font-family="Menlo, Monaco, 'Courier New', monospace" font-size="14" transform="translate(80,20)">
      <text x="0" y="0" fill="#7dd3fc">void</text>
      <text x="45" y="0" fill="#cbd5e1"> main() {</text>

      <text x="12" y="22" fill="#60a5fa">runApp</text>
      <text x="80" y="22" fill="#cbd5e1">(</text>
      <tspan x="88" y="22" fill="#a78bfa">MaterialApp</tspan>
      <text x="170" y="22" fill="#cbd5e1">(</text>

      <text x="24" y="44" fill="#9ae6b4">home:</text>
      <tspan x="80" y="44" fill="#a78bfa">Scaffold</tspan>
      <text x="142" y="44" fill="#cbd5e1">(</text>

      <text x="36" y="66" fill="#7dd3fc">appBar:</text>
      <tspan x="108" y="66" fill="#a78bfa">AppBar</tspan>
      <text x="156" y="66" fill="#cbd5e1">(</text>

      <text x="48" y="88" fill="#9ae6b4">title:</text>
      <tspan x="100" y="88" fill="#fca5a5">Text</tspan>
      <text x="140" y="88" fill="#cbd5e1">('flutterffi'),</text>

      <text x="36" y="110" fill="#cbd5e1">),</text>

      <text x="36" y="132" fill="#9ae6b4">body:</text>
      <tspan x="80" y="132" fill="#a78bfa">Center</tspan>
      <text x="120" y="132" fill="#cbd5e1">(</text>

      <text x="48" y="154" fill="#9ae6b4">child:</text>
      <tspan x="104" y="154" fill="#fce38a">Text</tspan>
      <text x="136" y="154" fill="#cbd5e1">('build across platforms'),</text>

      <text x="24" y="176" fill="#cbd5e1">),</text>
      <text x="12" y="198" fill="#cbd5e1">),</text>
      <text x="0" y="220" fill="#cbd5e1">);</text>

      <text x="0" y="242" fill="#cbd5e1">}</text>
    </g>

    <!-- colorful accent top-right -->
    <g transform="translate(960,12)">
      <rect x="0" y="0" width="120" height="40" rx="8" fill="url(#accent)" opacity="0.18"/>
      <text x="12" y="24" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e6f7ff">Flutter · FFI</text>
    </g>
  </g>

</svg>
